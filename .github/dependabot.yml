version: 2
updates:
  # Weekly PRs for npm security and version updates. Security fixes for
  # Next.js in particular should be merged quickly.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
